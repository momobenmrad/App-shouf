# Chouf — local infrastructure for development.
#   supabase start                                  # Postgres, Auth, Realtime (Supabase CLI)
#   docker compose -f docker-compose.dev.yml up -d  # Redis, SeaweedFS (R2 stand-in), edge, worker
#   pnpm --filter @chouf/web dev                    # Next.js on http://localhost:3000
name: chouf-dev

services:
  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]

  # S3-compatible stand-in for Cloudflare R2 (SeaweedFS, Apache-2.0).
  s3:
    image: chrislusf/seaweedfs:4.48
    command: server -dir=/data -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json
    ports: ["9000:9000"]
    volumes:
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
      - s3-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9333/cluster/status >/dev/null"]
      interval: 3s
      retries: 20

  s3-init:
    image: chrislusf/seaweedfs:4.48
    depends_on:
      s3: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c", "echo 's3.bucket.create -name chouf-media' | weed shell -master=s3:9333"]
    restart: "no"

  edge:
    build: { context: ., dockerfile: apps/edge/Dockerfile }
    ports: ["8787:8787"]
    environment:
      S3_ENDPOINT: http://s3:9000
      S3_BUCKET: chouf-media
      S3_ACCESS_KEY_ID: chouf
      S3_SECRET_ACCESS_KEY: chouf-dev-secret
      PLAYBACK_SIGNING_SECRET: ${PLAYBACK_SIGNING_SECRET:-dev-only-signing-secret-change-me-0123456789}
      EDGE_ALLOWED_ORIGINS: http://localhost:3000
    depends_on: [s3-init]

  worker:
    build: { context: ., dockerfile: apps/worker/Dockerfile }
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      REDIS_URL: redis://redis:6379
      SUPABASE_URL: ${SUPABASE_URL:-http://host.docker.internal:54321}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-} # export it from `supabase status`
      S3_ENDPOINT: http://s3:9000
      S3_BUCKET: chouf-media
      S3_ACCESS_KEY_ID: chouf
      S3_SECRET_ACCESS_KEY: chouf-dev-secret
      TRANSCODE_PRESET: ultrafast
    depends_on: [redis, s3-init]

volumes:
  s3-data:
