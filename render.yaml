# Blueprint Render : base Postgres + service web Next.js (région Francfort, la plus proche de la Tunisie).
databases:
  - name: tawa-db
    plan: free
    region: frankfurt
    databaseName: tawa
    user: tawa

services:
  - type: web
    name: tawa
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: tawa-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DEMO_MODE
        value: "true"
